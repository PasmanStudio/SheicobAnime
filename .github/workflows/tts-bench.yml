# Benchmark de la voz clonada (Qwen3-TTS) en CPU de un runner gratis.
# Prueba de viabilidad para el canal de YouTube: ¿alcanza la CPU para producir
# sin GPU? Corre solo en push a esta rama de prueba.
#
# La grabación de referencia va CIFRADA (youtube/voice/ref.tar.gpg) porque el
# repo es público; la clave está en el secret VOICE_REF_PASSPHRASE. Los audios
# generados también se suben cifrados: los artifacts de un repo público los
# puede bajar cualquiera con cuenta de GitHub.
name: tts-bench

on:
  push:
    branches: [feat/youtube-tts-bench]
    paths: [youtube/**, .github/workflows/tts-bench.yml]

permissions:
  contents: read

concurrency:
  group: tts-bench
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # torch CPU primero: si no, qwen-tts arrastra la build con CUDA (~2.5 GB).
      - name: Instalar Qwen3-TTS (CPU)
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-tts soundfile
          sudo apt-get install -y -qq sox libsox-dev > /dev/null || true

      - name: Cache del modelo
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-qwen3-tts-1.7b-base

      - name: Descifrar la referencia de voz
        env:
          VOICE_REF_PASSPHRASE: ${{ secrets.VOICE_REF_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/voice"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -d youtube/voice/ref.tar.gpg <<< "$VOICE_REF_PASSPHRASE" | tar -x -C "$RUNNER_TEMP/voice"
          ls -la "$RUNNER_TEMP/voice"

      - name: Benchmark 1.7B
        run: |
          python youtube/tts_bench.py "$RUNNER_TEMP/voice/ref_largo.wav" "$RUNNER_TEMP/voice/ref_largo.txt" \
            "$RUNNER_TEMP/out" 1.7B

      - name: Cifrar los audios
        if: always()
        env:
          VOICE_REF_PASSPHRASE: ${{ secrets.VOICE_REF_PASSPHRASE }}
        run: |
          [ -d "$RUNNER_TEMP/out" ] || exit 0
          tar -C "$RUNNER_TEMP" -cf audios.tar out
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 -o audios.tar.gpg audios.tar <<< "$VOICE_REF_PASSPHRASE"
          rm -rf audios.tar "$RUNNER_TEMP/voice"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tts-bench-audios
          path: audios.tar.gpg
          if-no-files-found: ignore
          retention-days: 3
